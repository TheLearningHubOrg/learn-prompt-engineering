[project]
name = "learn-prompt-engineering"
version = "1.0.0"
description = "Starter project for the learn-prompt-engineering guide: tokens and sampling, prompt templates, few-shot selection, reasoning loops and injection guards"
readme = "README.md"
authors = [{ name = "Manthan Ankolekar" }]
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
