[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-prompt-engineering"
version = "0.1.0"
description = "Advanced Prompt Engineering: Few-Shot In-Context Learning, Chain-of-Thought (CoT), Adversarial Defenses & DSPy Optimization"
readme = "README.md"
authors = [{ name = "The Learning Hub Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typing_extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
